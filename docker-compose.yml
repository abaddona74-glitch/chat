version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: chat_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_app
    ports:
      - "5432:5432"
    volumes:
      - chat_pg_data:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog:latest
    container_name: chat_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  chat_pg_data:
