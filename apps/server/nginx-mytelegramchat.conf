server {
    server_name mytelegramchat.ddns.net;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mytelegramchat.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mytelegramchat.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = mytelegramchat.ddns.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name mytelegramchat.ddns.net;
    return 404;
}
